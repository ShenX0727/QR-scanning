<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1413" media="(prefers-color-scheme: dark)">
<title>二维码识别</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <div>
      <h1>二维码识别</h1>
      <p class="sub">粘贴截图，看清二维码背后是什么，再决定用哪个 App 打开</p>
    </div>
  </header>

  <label id="drop" class="finder" tabindex="0" aria-label="拖入或选择二维码图片">
    <input id="file" type="file" accept="image/*" hidden>
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <span class="beam" aria-hidden="true"></span>
    <img id="preview" alt="待识别的图片" hidden>
    <span id="hint" class="hint">
      <strong>把二维码图片拖到这里</strong>
      <span>或按 <kbd>Ctrl</kbd> <kbd>V</kbd> 粘贴截图</span>
    </span>
  </label>

  <div class="actions">
    <button id="pasteBtn" type="button" class="btn primary">从剪贴板读取</button>
    <button id="pickBtn" type="button" class="btn">选择图片</button>
  </div>
  <p class="tryline">没有图片？<button id="sampleBtn" type="button" class="link">用示例试试</button></p>

  <p id="msg" class="msg" role="status"></p>

  <section id="result" class="result" hidden>
    <div class="result-head">
      <span id="kind" class="chip"></span>
      <span id="host" class="host"></span>
    </div>
    <div id="content" class="content"></div>
    <div id="app" class="app" hidden>
      <span id="appIcon" class="app-icon"></span>
      <div class="app-text">
        <div class="app-label">推荐打开方式</div>
        <div id="appName" class="app-name"></div>
        <div id="appTip" class="app-tip"></div>
      </div>
    </div>
    <div class="actions">
      <a id="openBtn" class="btn primary" target="_blank" rel="noopener noreferrer">打开</a>
      <a id="browserBtn" class="btn" target="_blank" rel="noopener noreferrer" hidden>用浏览器打开</a>
      <button id="copyBtn" type="button" class="btn">复制</button>
    </div>
  </section>

  <footer class="foot">图片只在你的浏览器里识别，不会上传到任何地方</footer>
</main>
