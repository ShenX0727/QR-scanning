<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二维码识别</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>二维码识别</h1>
  <p class="sub">粘贴、拖入或选择一张含二维码的图片</p>

  <label id="drop" class="drop" tabindex="0">
    <input id="file" type="file" accept="image/*" hidden>
    <img id="preview" alt="" hidden>
    <span id="hint">按 <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴，或点击选择图片</span>
  </label>

  <div class="actions">
    <button id="pasteBtn" type="button">从剪贴板读取</button>
    <button id="pickBtn" type="button" class="ghost">选择图片</button>
  </div>

  <section id="result" hidden>
    <div class="label" id="kind"></div>
    <div class="content" id="content"></div>
    <div class="app" id="app" hidden>
      <span class="app-icon" id="appIcon"></span>
      <div>
        <div class="app-name" id="appName"></div>
        <div class="app-tip" id="appTip"></div>
      </div>
    </div>
    <div class="actions">
      <a id="openBtn" class="btn" target="_blank" rel="noopener noreferrer">打开</a>
      <a id="browserBtn" class="btn ghost" target="_blank" rel="noopener noreferrer" hidden>用浏览器打开</a>
      <button id="copyBtn" type="button" class="ghost">复制</button>
    </div>
  </section>

  <p id="msg" class="msg"></p>
</main>
<script src="jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
