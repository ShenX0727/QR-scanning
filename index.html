<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7eaf1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#272b34" media="(prefers-color-scheme: dark)">
<title>二维码识别</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main>
  <section class="intro">
    <p class="eyebrow"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>QR 解码台</p>
    <h1>扫码之前，<br><em>先看清</em>它去哪儿</h1>
    <p class="lede">粘贴一张截图，立刻读出二维码里的链接，告诉你它属于哪个 App、安不安全、该怎么打开。</p>

    <div class="actions">
      <button id="pasteBtn" type="button" class="btn primary">从剪贴板读取</button>
      <button id="pickBtn" type="button" class="btn">选择图片</button>
    </div>
    <p class="tryline"><kbd>Ctrl</kbd><kbd>V</kbd> 直接粘贴 · 拖入图片 · <button id="sampleBtn" type="button" class="link">用示例试试</button></p>

    <div class="known">
      <p class="known-label">能认出的 App</p>
      <ul id="appList" class="tiles"></ul>
    </div>
  </section>

  <section class="stage">
    <label id="drop" class="finder" tabindex="0" aria-label="拖入或选择二维码图片">
      <input id="file" type="file" accept="image/*" hidden>
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <span class="beam" aria-hidden="true"></span>
      <span class="readout" id="readout">等待图片</span>
      <img id="preview" alt="待识别的图片" hidden>
      <span id="hint" class="hint">
        <strong>把二维码放进框里</strong>
        <span>拖入、粘贴或点击选择</span>
      </span>
    </label>

    <p id="msg" class="msg" role="status"></p>

    <article id="result" class="ticket" hidden>
      <header class="ticket-head">
        <span class="ticket-title">解码结果</span>
        <span id="kind" class="chip"></span>
        <span id="safety" class="safety" hidden></span>
      </header>
      <div id="host" class="host"></div>
      <div id="content" class="content"></div>
      <div class="tear" aria-hidden="true"></div>
      <div id="app" class="app" hidden>
        <span id="appIcon" class="app-icon"></span>
        <div class="app-text">
          <div class="app-label">推荐打开方式</div>
          <div id="appName" class="app-name"></div>
          <div id="appTip" class="app-tip"></div>
        </div>
      </div>
      <div class="actions">
        <a id="openBtn" class="btn primary" target="_blank" rel="noopener noreferrer">打开</a>
        <a id="browserBtn" class="btn" target="_blank" rel="noopener noreferrer" hidden>用浏览器打开</a>
        <button id="copyBtn" type="button" class="btn">复制</button>
      </div>
    </article>
  </section>

  <footer class="foot">图片只在你的浏览器里识别，不会上传到任何地方</footer>
</main>
