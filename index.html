<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8eaf0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#24272f" media="(prefers-color-scheme: dark)">
<title>二维码识别</title>
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<div class="shell">
  <header class="bar">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <h1>二维码识别</h1>
  </header>

  <section class="scan">
    <div id="drop" class="finder" aria-label="把二维码图片拖到这里">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <span class="beam" aria-hidden="true"></span>
      <img id="preview" alt="待识别的图片" hidden>
      <span id="hint" class="hint">
        <strong class="idle">放一张二维码图片</strong><strong class="drag">松手就行</strong>
        <span class="desk">拖进来，或者 <kbd>Ctrl</kbd> <kbd>V</kbd></span>
        <span class="touch">点下面的「选择图片」</span>
      </span>
    </div>
    <input id="file" type="file" accept="image/*" hidden>
  </section>

  <section class="side">
    <div class="actions">
      <button id="pasteBtn" type="button" class="btn primary">读取剪贴板</button>
      <button id="pickBtn" type="button" class="btn">选择图片</button>
    </div>
    <p id="msg" class="msg" role="status"></p>

    <div id="empty" class="panel empty">
      <p>识别出的内容会出现在这里</p><p class="sub-hint">按 Esc 可以清空，重新来</p>
    </div>

    <article id="result" class="panel result" hidden>
      <div class="who">
        <span id="appIcon" class="app-icon"></span>
        <div class="who-text">
          <div id="appName" class="app-name"></div>
          <div id="appTip" class="app-tip"></div>
        </div>
        <span id="safety" class="tag" hidden></span>
      </div>
      <div class="content"><div id="content" class="txt"></div></div>
      <div class="actions">
        <a id="openBtn" class="btn primary" target="_blank" rel="noopener noreferrer">打开</a>
        <a id="browserBtn" class="btn" target="_blank" rel="noopener noreferrer" hidden>浏览器</a>
        <button id="copyBtn" type="button" class="btn">复制</button>
      </div>
    </article>
  </section>
</div>
<script src="jsQR.js"></script>
<script src="apps.js?v=15"></script>
<script src="glass.js?v=15"></script>
<script src="app.js?v=15"></script>
</body>
</html>
